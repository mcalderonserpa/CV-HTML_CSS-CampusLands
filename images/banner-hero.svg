  <circle cx="150" cy="148" r="7" fill="#D9BDCA" />
  <circle cx="300" cy="200" r="7" fill="#D9BDCA" />
  <circle cx="420" cy="120" r="7" fill="#D9BDCA" />
  <circle cx="540" cy="90" r="8" fill="#D9BDCA" />
  <text x="300" y="340" text-anchor="middle" fill="#D9BDCA" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="14" letter-spacing="2" opacity="0.9">ÁLGEBRA · OPTIMIZACIÓN · SOFTWARE</text>
</svg>
